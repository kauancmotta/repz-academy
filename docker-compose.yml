services:
  db:
    image: postgres:16
    container_name: repz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repz}
      POSTGRES_DB: ${POSTGRES_DB:-repz}
    ports:
      - "5432:5432"
    volumes:
      - repz_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  repz_pgdata:
